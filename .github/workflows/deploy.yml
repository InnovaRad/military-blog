name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. 完整 checkout（保留全部 git 歷史以便取得日期）──
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. 執行建置腳本（更新日期、重建首頁卡片）──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run build script
        run: python scripts/build.py

      # ── 3. 部署到 GitHub Pages（gh-pages 分支）──
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          # 不把開發用檔案部署到 Pages
          exclude_assets: >-
            .github,
            scripts,
            supabase-setup.sql,
            README.md,
            .gitignore
          commit_message: 'deploy: auto build [skip ci]'

      # ── 4. 部署到 Cloudflare Pages ──
      # 前置作業：在 GitHub repo Settings → Secrets 中新增三個 secret：
      #   CLOUDFLARE_API_TOKEN   — Cloudflare Dashboard → My Profile → API Tokens
      #   CLOUDFLARE_ACCOUNT_ID  — Cloudflare Dashboard → 右下角 Account ID
      #   CLOUDFLARE_PROJECT_NAME — 您在 Cloudflare Pages 建立的專案名稱
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy .
            --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }}
            --branch=main
            --commit-dirty=true
